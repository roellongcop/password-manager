<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Iframe login</title>
    <style>
      body { font: 14px/1.5 -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 16px; }
      label { display: block; font-size: 12px; color: #5b6572; margin: 8px 0 4px; }
      input { width: 100%; padding: 8px 10px; border: 1px solid #dde3ea; border-radius: 8px; font: inherit; }
      button { margin-top: 10px; padding: 7px 12px; border-radius: 8px; border: 1px solid #2f6f4f;
               background: #2f6f4f; color: #fff; font: inherit; cursor: pointer; }
      output { display: block; margin-top: 10px; font-size: 13px; color: #2f6f4f; }
    </style>
  </head>
  <body>
    <form id="f">
      <label for="u">Email</label>
      <input id="u" type="email" autocomplete="username" />
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
      <output id="out"></output>
    </form>
    <script>
      document.getElementById('f').addEventListener('submit', (event) => {
        event.preventDefault();
        document.getElementById('out').textContent =
          'Submitted: ' + document.getElementById('u').value + ' / ' + document.getElementById('p').value;
      });
    </script>
  </body>
</html>
